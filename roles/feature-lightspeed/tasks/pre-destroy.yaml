---
- name: Fetch kubeconfig from vault
  ansible.builtin.include_role:
    name: internal-fetch-kubeconfig

- name: Remove OLSConfig CR
  ignore_errors: true
  kubernetes.core.k8s:
    kubeconfig: "{{ cluster_access_kubeconfig }}"
    state: absent
    wait: yes
    wait_timeout: 300
    definition:
      kind: OLSConfig
      apiVersion: ols.openshift.io/v1alpha1
      metadata:
        name: cluster

- name: Remove LLM credential secret
  ignore_errors: true
  kubernetes.core.k8s:
    kubeconfig: "{{ cluster_access_kubeconfig }}"
    state: absent
    definition:
      kind: Secret
      apiVersion: v1
      metadata:
        name: "{{ lightspeed_credential_secret_name }}"
        namespace: "{{ lightspeed_namespace }}"

- name: Remove ClusterServiceVersion
  kubernetes.core.k8s:
    kubeconfig: "{{ cluster_access_kubeconfig }}"
    state: absent
    delete_all: true
    wait: yes
    wait_timeout: 300
    kind: ClusterServiceVersion
    api_version: operators.coreos.com/v1alpha1
    namespace: "{{ lightspeed_namespace }}"
    label_selectors:
      - "operators.coreos.com/lightspeed-operator.{{ lightspeed_namespace }}"

- name: Remove Subscription, OperatorGroup and Namespace
  kubernetes.core.k8s:
    kubeconfig: "{{ cluster_access_kubeconfig }}"
    state: absent
    wait: yes
    wait_timeout: 300
    definition:
      - kind: Subscription
        apiVersion: operators.coreos.com/v1alpha1
        metadata:
          name: lightspeed-operator
          namespace: "{{ lightspeed_namespace }}"
      - kind: OperatorGroup
        apiVersion: operators.coreos.com/v1
        metadata:
          name: openshift-lightspeed-og
          namespace: "{{ lightspeed_namespace }}"
      - kind: Namespace
        apiVersion: v1
        metadata:
          name: "{{ lightspeed_namespace }}"

- name: Remove CRDs
  kubernetes.core.k8s:
    kubeconfig: "{{ cluster_access_kubeconfig }}"
    state: absent
    delete_all: true
    wait: yes
    wait_timeout: 300
    kind: CustomResourceDefinition
    api_version: apiextensions.k8s.io/v1
    label_selectors:
      - "operators.coreos.com/lightspeed-operator.{{ lightspeed_namespace }}"
