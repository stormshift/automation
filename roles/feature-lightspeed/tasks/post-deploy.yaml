---
- name: Fetch kubeconfig from vault
  ansible.builtin.include_role:
    name: internal-fetch-kubeconfig

- name: Fetch GCP service account credential from vault
  community.hashi_vault.vault_kv2_get:
    url: "{{ lookup('ansible.builtin.env', 'RH_VAULT_URL') }}"
    auth_method: approle
    role_id: "{{ lookup('ansible.builtin.env', 'RH_VAULT_ROLE_ID') }}"
    secret_id: "{{ lookup('ansible.builtin.env', 'RH_VAULT_SECRET_ID') }}"
    ca_cert: "{{ lookup('ansible.builtin.env', 'RH_VAULT_CA_CERT_FILENAME') }}"
    engine_mount_point: apps
    path: "{{ lightspeed_vault_secret_path }}"
  register: lightspeed_vault_credential

- name: Install Lightspeed operator
  kubernetes.core.k8s:
    kubeconfig: "{{ cluster_access_kubeconfig }}"
    state: present
    definition:
      - kind: Namespace
        apiVersion: v1
        metadata:
          name: "{{ lightspeed_namespace }}"

      - kind: OperatorGroup
        apiVersion: operators.coreos.com/v1
        metadata:
          name: openshift-lightspeed-og
          namespace: "{{ lightspeed_namespace }}"
        spec:
          targetNamespaces:
            - "{{ lightspeed_namespace }}"

      - kind: Subscription
        apiVersion: operators.coreos.com/v1alpha1
        metadata:
          name: lightspeed-operator
          namespace: "{{ lightspeed_namespace }}"
        spec:
          installPlanApproval: Automatic
          channel: "{{ lightspeed_channel }}"
          name: lightspeed-operator
          source: redhat-operators
          sourceNamespace: openshift-marketplace

- name: Wait for OLSConfig CRD to be established
  kubernetes.core.k8s_info:
    kubeconfig: "{{ cluster_access_kubeconfig }}"
    kind: CustomResourceDefinition
    name: olsconfigs.ols.openshift.io
    wait: yes
    wait_timeout: 300
    wait_condition:
      type: Established
      status: True

- name: Wait for operator deployment to be available
  kubernetes.core.k8s_info:
    kubeconfig: "{{ cluster_access_kubeconfig }}"
    kind: Deployment
    name: lightspeed-operator-controller-manager
    namespace: "{{ lightspeed_namespace }}"
    wait: yes
    wait_timeout: 300
    wait_condition:
      type: Available
      status: True
      reason: MinimumReplicasAvailable

- name: Create LLM credential secret
  kubernetes.core.k8s:
    kubeconfig: "{{ cluster_access_kubeconfig }}"
    state: present
    definition: "{{ lookup('template', 'lightspeed_credential_secret.yaml') | from_yaml }}"

- name: Deploy OLSConfig
  kubernetes.core.k8s:
    kubeconfig: "{{ cluster_access_kubeconfig }}"
    state: present
    wait: yes
    wait_timeout: 600
    wait_condition:
      type: ApiReady
      status: True
      reason: Available
    definition: "{{ lookup('template', 'lightspeed_olsconfig.yaml') | from_yaml }}"
