---
# Red Hat External Secrets Operator uninstall does not remove operand resources.
- name: Fetch kubeconfig from vault
  ansible.builtin.include_role:
    name: internal-fetch-kubeconfig

- name: Remove External Secrets operand namespace
  ignore_errors: true
  kubernetes.core.k8s:
    kubeconfig: "{{ cluster_access_kubeconfig }}"
    state: absent
    wait: yes
    wait_timeout: 300
    definition:
      kind: Namespace
      apiVersion: v1
      metadata:
        name: "{{ external_secrets_operand_namespace }}"
